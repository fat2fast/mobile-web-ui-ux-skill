<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="manifest" href="/app/manifest.webmanifest"><link rel="stylesheet" href="/app/static.123.css"><title>PWA fixture</title></head><body>
<h1>PWA fixture</h1><p id="display-mode"></p><nav><a href="/app/">Overview</a> <a id="detail-link" href="/app/detail">Detail</a></nav><label>Draft <input id="draft"></label><button id="save">Save</button><button id="notifications">Enable notifications</button><button id="notification-status">Check notifications</button><button id="update" hidden>Apply update</button><button id="menu">Open menu</button><dialog id="dialog"><button id="close">Close menu</button></dialog><aside id="install-offer" hidden><button id="install">Install</button><button id="dismiss">Dismiss</button></aside><label>Manifest URL <input id="manifest-url" value="/app/manifest.webmanifest"></label><button id="audit">Check manifest</button><p id="audit-result" role="status"></p><p id="status" role="status"></p><p id="permission" role="status"></p><p id="subscription" role="status"></p><p id="update-status" role="status"></p><div aria-hidden="true" style="height: 1100px"></div>
<script>
let registration;
let csrfToken = 'fixture-current';
const refreshForm = document.createElement('button');
refreshForm.id = 'refresh-form'; refreshForm.textContent = 'Refresh form';
document.querySelector('#save').after(refreshForm);
document.querySelector('#audit').addEventListener('click', async () => {
  const result = document.querySelector('#audit-result');
  result.textContent = 'Checking';
  try {
    const manifestUrl = new URL(document.querySelector('#manifest-url').value, location.href);
    if (manifestUrl.origin !== location.origin) throw new Error('foreign manifest');
    const response = await fetch(manifestUrl);
    if (!response.ok) throw new Error('manifest unavailable');
    const manifest = await response.json();
    if (typeof manifest.start_url !== 'string' || !manifest.start_url || typeof manifest.scope !== 'string' || !manifest.scope) throw new Error('missing fields');
    const start = new URL(manifest.start_url, manifestUrl);
    const scope = new URL(manifest.scope, manifestUrl);
    if (start.origin !== location.origin || scope.origin !== location.origin || !start.pathname.startsWith(scope.pathname)) throw new Error('invalid scope');
    const worker = await navigator.serviceWorker.ready;
    if (!start.href.startsWith(worker.scope)) throw new Error('outside worker scope');
    result.textContent = 'Manifest scope valid';
  } catch (error) { result.textContent = 'Manifest invalid or unavailable'; }
});
document.querySelector('#display-mode').textContent = matchMedia('(display-mode: standalone)').matches ? 'Standalone mode' : 'Browser tab';
const currentUser = /(?:^|;\s*)user=([AB])(?:;|$)/.exec(document.cookie)?.[1] || 'anonymous';
const draftKey = 'fixture-draft-' + currentUser;
const restored = sessionStorage.getItem(draftKey);
if (restored !== null) document.querySelector('#draft').value = restored;
document.querySelector('#draft').addEventListener('input', event => sessionStorage.setItem(draftKey, event.target.value));
const navigationKey = 'fixture-navigation-' + currentUser + location.pathname;
window.addEventListener('pagehide', () => sessionStorage.setItem(navigationKey, JSON.stringify({ scroll: scrollY, focus: document.activeElement?.id || '' })));
window.addEventListener('pageshow', event => {
  const state = sessionStorage.getItem(navigationKey);
  if (!state || (!event.persisted && performance.getEntriesByType('navigation')[0]?.type !== 'back_forward')) return;
  const saved = JSON.parse(state);
  document.getElementById(saved.focus)?.focus({ preventScroll: true });
  scrollTo(0, saved.scroll);
});
let installEvent;
window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); if (matchMedia('(display-mode: standalone)').matches) return; installEvent = event; document.querySelector('#install-offer').hidden = false; });
document.querySelector('#dismiss').addEventListener('click', () => { document.querySelector('#install-offer').hidden = true; installEvent = null; });
document.querySelector('#install').addEventListener('click', async () => { if (installEvent) await installEvent.prompt(); installEvent = null; document.querySelector('#install-offer').hidden = true; });
document.querySelector('#menu').addEventListener('click', () => document.querySelector('#dialog').showModal());
document.querySelector('#close').addEventListener('click', () => { document.querySelector('#dialog').close(); document.querySelector('#menu').focus(); });
function showWaiting() { if (registration && registration.waiting) { document.querySelector('#update').hidden = false; document.querySelector('#update-status').textContent = 'Update ready'; } }
navigator.serviceWorker.register('/app/sw.js', {scope: '/app/'}).then(value => { registration = value; showWaiting(); value.addEventListener('updatefound', () => { const worker = value.installing; worker.addEventListener('statechange', showWaiting); }); });
navigator.serviceWorker.addEventListener('controllerchange', () => { document.querySelector('#update').hidden = true; document.querySelector('#update-status').textContent = 'Update active'; });
document.querySelector('#update').addEventListener('click', () => {
  if (document.querySelector('#draft').value) { document.querySelector('#update-status').textContent = 'Save your draft before updating'; return; }
  if (registration && registration.waiting) registration.waiting.postMessage('activate');
});
window.safeTarget = value => { try { const target = new URL(value, location.origin); return target.origin === location.origin && target.pathname.startsWith('/app/') ? target.href : null; } catch { return null; } };
document.querySelector('#notifications').addEventListener('click', async () => {
  const result = !('Notification' in window) ? 'unsupported' : Notification.permission === 'default' ? await Notification.requestPermission() : Notification.permission;
  document.querySelector('#permission').textContent = result;
});
document.querySelector('#notification-status').addEventListener('click', async () => {
  const output = document.querySelector('#subscription');
  if (!('Notification' in window) || Notification.permission !== 'granted') { output.textContent = 'Not subscribed'; return; }
  const reg = await navigator.serviceWorker.ready;
  output.textContent = reg.pushManager && await reg.pushManager.getSubscription() ? 'Subscribed' : 'Not subscribed';
});
document.querySelector('#save').addEventListener('click', async () => {
  const draft = document.querySelector('#draft');
  const submitted = draft.value;
  try { const response = await fetch('/app/write', {method:'POST', headers: {'X-CSRF-Token': csrfToken}, body: submitted}); document.querySelector('#status').textContent = response.ok ? 'Saved' : response.status === 403 ? 'Form expired; refresh and retry' : 'Not saved'; if (response.ok && draft.value === submitted) { draft.value = ''; sessionStorage.removeItem(draftKey); } }
  catch { document.querySelector('#status').textContent = 'Not saved'; }
});
document.querySelector('#refresh-form').addEventListener('click', async () => { try { const response = await fetch('/app/token', {cache: 'no-store'}); if (!response.ok) throw new Error('refresh failed'); csrfToken = await response.text(); document.querySelector('#status').textContent = 'Form refreshed; retry save'; } catch { document.querySelector('#status').textContent = 'Refresh failed; reconnect and retry'; } });
</script></body></html>
