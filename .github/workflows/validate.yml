name: Validate skill

on:
  push:
  pull_request:

jobs:
  structural-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate skill structure
        run: python3 scripts/validate_skill.py
      - name: Test comparison tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  fixture-builds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fixture: [order-dashboard, mobile-form, comparison-table, request-form]
    defaults:
      run:
        working-directory: evals/fixtures/${{ matrix.fixture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: evals/fixtures/${{ matrix.fixture }}/package-lock.json
      - name: Install ${{ matrix.fixture }} dependencies
        run: npm ci
      - name: Build ${{ matrix.fixture }}
        run: npm run build
      - name: Record current-run fixture build
        env:
          PROJECT: evals/fixtures/${{ matrix.fixture }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/builds"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          project = os.environ["PROJECT"]
          output = Path(os.environ["RUNNER_TEMP"]) / "builds" / (project.replace("/", "-") + ".json")
          output.write_text(json.dumps({"project": project, "sha": os.environ["SHA"],
                                        "run_id": os.environ["RUN_ID"], "success": True,
                                        "exit_code": 0}), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: build-fixture-${{ matrix.fixture }}
          path: ${{ runner.temp }}/builds/*.json

  implementation-builds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        implementation: [order-dashboard, comparison-table, request-form]
    defaults:
      run:
        working-directory: evals/implementations/task-first/${{ matrix.implementation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: evals/implementations/task-first/${{ matrix.implementation }}/package-lock.json
      - name: Install ${{ matrix.implementation }} dependencies
        run: npm ci
      - name: Build ${{ matrix.implementation }}
        run: npm run build
      - name: Record current-run implementation build
        env:
          PROJECT: evals/implementations/task-first/${{ matrix.implementation }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/builds"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          project = os.environ["PROJECT"]
          output = Path(os.environ["RUNNER_TEMP"]) / "builds" / (project.replace("/", "-") + ".json")
          output.write_text(json.dumps({"project": project, "sha": os.environ["SHA"],
                                        "run_id": os.environ["RUN_ID"], "success": True,
                                        "exit_code": 0}), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: build-implementation-${{ matrix.implementation }}
          path: ${{ runner.temp }}/builds/*.json

  task-ux-browser:
    runs-on: ubuntu-latest
    needs: [structural-validation, fixture-builds, implementation-builds]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/task-ux/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: ${{ runner.temp }}/task-ux/builds
          merge-multiple: true
      - name: Install dependencies across all fixtures and implementations
        run: |
          for dir in evals/fixtures/order-dashboard evals/fixtures/comparison-table evals/fixtures/request-form evals/implementations/task-first/order-dashboard evals/implementations/task-first/comparison-table evals/implementations/task-first/request-form; do
            npm --prefix "$dir" ci
          done
      - name: Install task-ux dependencies and Playwright Chromium
        working-directory: tests/task-ux
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright task UX suite
        working-directory: tests/task-ux
        env:
          TASK_UX_RESULTS: ${{ runner.temp }}/task-ux/test-results.json
          TASK_UX_SCREENSHOTS: ${{ runner.temp }}/task-ux/screenshots
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 stamp-test-results.py --begin --results "$TASK_UX_RESULTS" --manifest "$RUNNER_TEMP/task-ux/run-manifest.json" --sha "$SHA" --run-id "$RUN_ID"
          npx playwright test
      - name: Bind and verify current-run evidence
        env:
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 tests/task-ux/stamp-test-results.py --results "$RUNNER_TEMP/task-ux/test-results.json" --manifest "$RUNNER_TEMP/task-ux/run-manifest.json" --sha "$SHA" --run-id "$RUN_ID"
          python3 tests/task-ux/collect-build-results.py --input-dir "$RUNNER_TEMP/task-ux/builds" --output "$RUNNER_TEMP/task-ux/build-results.json" --sha "$SHA" --run-id "$RUN_ID"
          python3 tests/task-ux/verify-evidence.py --build-results "$RUNNER_TEMP/task-ux/build-results.json" --test-results "$RUNNER_TEMP/task-ux/test-results.json" --run-manifest "$RUNNER_TEMP/task-ux/run-manifest.json" --sha "$SHA" --run-id "$RUN_ID"
          python3 tests/task-ux/check-evidence-rejections.py --build-results "$RUNNER_TEMP/task-ux/build-results.json" --test-results "$RUNNER_TEMP/task-ux/test-results.json" --run-manifest "$RUNNER_TEMP/task-ux/run-manifest.json" --sha "$SHA" --run-id "$RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-ux-evidence
          path: |
            ${{ runner.temp }}/task-ux/*.json
            ${{ runner.temp }}/task-ux/screenshots/*.png
          if-no-files-found: ignore